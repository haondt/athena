[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
requires-python = ">=3.14"
name = "haondt-athena"
authors = [{name = "haondt"}]
classifiers = ["License :: OSI Approved :: MIT License"]
readme = "README.md"
description = "a file-based rest api client"
license = { file = "LICENSE" }
keywords = ["api", "rest"]
dependencies = [
    "click>=8.3.2",
    "PyYAML>=6.0.3",
    "requests>=2.33.1",
    "aiohttp>=3.13.5",
    "Pygments>=2.20.0",
    "watchdog>=6.0.0",
    "Faker>=40.13.0",
    "Flask==3.1.3"
]
dynamic = ["version"]

[tool.flit.module]
name = "athena"

[project.urls]
Homepage = "https://gitlab.com/haondt/athena"
Repository = "https://gitlab.com/haondt/athena"

[project.scripts]
athena = "athena.__main__:main"

[project.optional-dependencies]
dev = [
    "poetry",
    "mkdocstrings[python]",
    "mkdocs-material",
    "mkdocs-click",
]
